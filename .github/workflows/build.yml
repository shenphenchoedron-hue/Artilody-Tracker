name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  SOUNDFONT_URL: https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/main/GeneralUser-GS.sf2

jobs:
  linux:
    name: Linux (${{ matrix.distro }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian12
            image: debian:bookworm
          - distro: ubuntu22.04
            image: ubuntu:22.04
          - distro: ubuntu24.04
            image: ubuntu:24.04
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git curl ca-certificates pkg-config file dpkg-dev \
            libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev

      - uses: actions/checkout@v4

      - name: Download SoundFont
        run: |
          mkdir -p soundfonts
          curl -fsSL -o soundfonts/GeneralUser-GS.sf2 "$SOUNDFONT_URL"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DARTILODY_DISTRO_SUFFIX=${{ matrix.distro }}

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Package (.deb)
        run: |
          cd build
          cpack -G DEB
          ls -la *.deb

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.distro }}
          path: build/*.deb

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download SoundFont
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path soundfonts | Out-Null
          Invoke-WebRequest -Uri $env:SOUNDFONT_URL -OutFile soundfonts/GeneralUser-GS.sf2

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Stage files
        shell: pwsh
        run: |
          $dist = "dist/windows"
          New-Item -ItemType Directory -Force -Path "$dist/soundfonts" | Out-Null
          Copy-Item "build/ArtilodyTracker_artefacts/Release/Artilody Tracker.exe" $dist
          Copy-Item soundfonts/GeneralUser-GS.sf2 "$dist/soundfonts/"
          Copy-Item LICENSE, THIRD_PARTY_LICENSES.md, README.md $dist

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(ArtilodyTracker VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" packaging/windows/installer.iss
          Compress-Archive -Path dist/windows/* -DestinationPath "dist/ArtilodyTracker-$version-Windows-x64-portable.zip"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip

  macos:
    name: macOS (universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Download SoundFont
        run: |
          mkdir -p soundfonts
          curl -fsSL -o soundfonts/GeneralUser-GS.sf2 "$SOUNDFONT_URL"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Bundle + DMG
        run: |
          VERSION=$(sed -n 's/^project(ArtilodyTracker VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          APP="build/ArtilodyTracker_artefacts/Release/Artilody Tracker.app"
          mkdir -p "$APP/Contents/Resources/soundfonts"
          cp soundfonts/GeneralUser-GS.sf2 "$APP/Contents/Resources/soundfonts/"
          codesign --force --deep --sign - "$APP"
          mkdir -p dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          cp LICENSE THIRD_PARTY_LICENSES.md dmg/
          mkdir -p dist
          hdiutil create -volname "Artilody Tracker" -srcfolder dmg -ov -format UDZO "dist/ArtilodyTracker-$VERSION-macOS-universal.dmg"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ linux, windows, macos ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts

      - uses: softprops/action-gh-release@v2
        with:
          name: Artilody Tracker ${{ github.ref_name }}
          body_path: packaging/RELEASE_NOTES.md
          files: artifacts/*
